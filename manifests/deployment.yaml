# Deployed into the `dev` namespace by Argo CD (the Application CR watching
# this repo lives in the Inception_of_things repo's p3/confs/application.yaml).
#
# The v1 -> v2 demo: bump the image tag on the `image:` line below
# (wil42/playground:v1 -> :v2), commit, push -- Argo CD's automated +
# selfHeal sync policy picks it up on its own.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: wil-playground
  namespace: dev
  labels:
    app: wil-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wil-playground
  template:
    metadata:
      labels:
        app: wil-playground
    spec:
      containers:
        - name: wil-playground
          image: wil42/playground:v2
          ports:
            - containerPort: 8888
